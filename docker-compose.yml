services:
  postgres:
    image: postgres:17-alpine
    container_name: hau-cex-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: hau-cex-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  matching-engine:
    build:
      context: ./services/matching-engine
      dockerfile: Dockerfile
    container_name: hau-cex-engine
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  backend-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hau-cex-api
    restart: unless-stopped
    entrypoint: ["/app/apps/backend/entrypoint.api.sh"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT:-3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      TREASURY_USER_ID: ${TREASURY_USER_ID}
      ENGINE_COMMAND_STREAM: ${ENGINE_COMMAND_STREAM:-stream:engine:commands}
      ENGINE_EVENT_STREAM: ${ENGINE_EVENT_STREAM:-stream:engine:events}
      MARKET_EVENT_STREAM: ${MARKET_EVENT_STREAM:-stream:market:events}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-stream:dead-letter}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hau-cex-worker
    restart: unless-stopped
    entrypoint: ["/app/apps/backend/entrypoint.worker.sh"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      TREASURY_USER_ID: ${TREASURY_USER_ID}
      ENGINE_COMMAND_STREAM: ${ENGINE_COMMAND_STREAM:-stream:engine:commands}
      ENGINE_EVENT_STREAM: ${ENGINE_EVENT_STREAM:-stream:engine:events}
      MARKET_EVENT_STREAM: ${MARKET_EVENT_STREAM:-stream:market:events}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-stream:dead-letter}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
